{% extends 'base.html' %}

{% block 'titulo' %} Login {% endblock%}

{% block 'conteudo' %} 

<div class="container">
    <br>
    {% if messages %}
        {% for i in messages %}
            
            <div class="alert alert-{{i.tags}}" role="alert">
                {{i}} 
            </div>
        {% endfor %}
    {% endif %}


    <div class="row">
        <div class="col-md-3">

        </div>

        <div class="col-md">
            <h1>Logar</h1>
            <hr>
            <form action="{% url 'valida_login' %}" method="POST">
                <label>Email:</label> {% csrf_token %}
                <input class="form-control" type="text" placeholder="Email" name="email">
                <br>
                <label>Senha:</label>
                <input class="form-control" type="password" placeholder="Senha" name="senha">
                <br>
                <input class="btn btn-success btn-lg" type="submit" value="Enviar">
                <a href="{% url 'cadastro' %}" class="btn btn-info btn-lg">Cadastre-se</a>

            </form>
        </div>

        <div class="col-md-3">

        </div>
    </div>


</div>
{% endblock %}
