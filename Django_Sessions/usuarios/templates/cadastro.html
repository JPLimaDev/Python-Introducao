{% extends 'base.html' %}

{% block 'titulo' %} Cadastro {% endblock%}

{% block 'conteudo' %} 

<div class="container">
    {% if messages %}
        {% for i in messages %}
            <div class="alert alert-{{i.tags}}" role="alert">
                {{i}} 
            </div>
        {% endfor %}
    {% endif %}
    <div class="row">
        <div class="col-md-3">

        </div>

        <div class="col-md">
            <h1>Cadastre-se</h1>
            <hr>
            <form action="{% url 'valida_cadastro'%}" method="POST">
                <label>Nome:</label> {% csrf_token %}
                <input class="form-control" type="text" placeholder="Nome" name="nome">
                <br>
                <label>Email:</label>
                <input class="form-control" type="text" placeholder="Email" name="email">
                <br>
                <label>Senha:</label>
                <input class="form-control" type="password" placeholder="Senha" name="senha">
                <br>
                <hr>
                <h2>Dados Residenciais</h2>
                <label>Cep:</label>
                <input class="form-control" type="text" placeholder="Cep" name="cep">
                <br>
                <label>Rua:</label>
                <input class="form-control" type="text" placeholder="Rua" name="rua">
                <br>
                <label>Numero:</label>
                <input class="form-control" type="text" placeholder="Numero" name="numero">
                <br>
                <input class="btn btn-success btn-lg" type="submit" value="Enviar">
                <a href="{% url 'login' %}" class="btn btn-info btn-lg">Login</a>

            </form>
        </div>

        <div class="col-md-3">

        </div>
    </div>


</div>
{% endblock %}
